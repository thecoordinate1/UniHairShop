<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0C" />
    
    <!-- PWA & Mobile Web App Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="UniHairShop" />
    <meta name="application-name" content="UniHairShop" />
    
    <!-- Manifest & Icons -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    
    <title>UniHairShop — Premium Campus Grooming & Beauty</title>
    <meta name="description" content="On-campus hair grooming, barbing, nails, makeup, and beauty products in Zambia. Fast mobile booking with Airtel, MTN, and Zamtel mobile money." />
    
    <!-- Google Fonts — preconnect + non-blocking load -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    </noscript>
    
    <!-- Inline Splash Screen Styles — renders instantly, no external deps -->
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: radial-gradient(circle at center, #1E1E2A 0%, #0A0A0C 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        color: #FFFFFF;
        transition: opacity 0.45s ease-out, transform 0.45s ease-out;
        will-change: opacity, transform;
      }
      #app-splash.splash-hide {
        opacity: 0;
        transform: scale(1.04);
        pointer-events: none;
      }
      .splash-card {
        background: rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(245, 166, 35, 0.25);
        border-radius: 36px;
        padding: 40px 48px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.15);
        animation: splashCardIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .splash-logo-wrapper {
        position: relative;
        width: 110px;
        height: 110px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .splash-glow-ring {
        position: absolute;
        inset: -12px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(245, 166, 35, 0.35) 0%, rgba(10, 10, 12, 0) 70%);
        animation: splashPulse 2s ease-in-out infinite alternate;
      }
      .splash-spin-ring {
        position: absolute;
        inset: -4px;
        border: 3px solid rgba(255, 255, 255, 0.08);
        border-top: 3px solid #F5A623;
        border-right: 3px solid #FFB800;
        border-radius: 50%;
        animation: splashSpin 1.1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
      }
      .splash-svg-logo {
        width: 80px;
        height: 80px;
        z-index: 2;
        filter: drop-shadow(0 4px 12px rgba(245, 166, 35, 0.4));
      }
      .splash-brand {
        text-align: center;
      }
      .splash-title {
        color: #FFFFFF;
        font-size: 1.75rem;
        font-weight: 800;
        letter-spacing: -0.03em;
        margin: 0 0 6px 0;
        background: linear-gradient(135deg, #FFFFFF 0%, #E2E8F0 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .splash-tagline {
        color: #F5A623;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        background: rgba(245, 166, 35, 0.12);
        padding: 5px 14px;
        border-radius: 20px;
        border: 1px solid rgba(245, 166, 35, 0.3);
        display: inline-block;
      }
      .splash-progress-bar {
        width: 140px;
        height: 4px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 4px;
        overflow: hidden;
        position: relative;
        margin-top: 4px;
      }
      .splash-progress-fill {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: 100%;
        background: linear-gradient(90deg, #F5A623, #007AFF, #F5A623);
        background-size: 200% 100%;
        animation: splashShimmer 1.5s ease-in-out infinite;
      }
      @keyframes splashSpin {
        to { transform: rotate(360deg); }
      }
      @keyframes splashPulse {
        from { opacity: 0.4; transform: scale(0.92); }
        to { opacity: 1; transform: scale(1.12); }
      }
      @keyframes splashShimmer {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
      @keyframes splashCardIn {
        0% { opacity: 0; transform: scale(0.92) translateY(16px); }
        100% { opacity: 1; transform: scale(1) translateY(0); }
      }
    </style>
  </head>
  <body class="bg-[#0A0A0C] text-slate-100 font-body antialiased selection:bg-blue-500/30 selection:text-white">
    <!-- Splash screen OUTSIDE #root so React doesn't destroy it on mount -->
    <div id="app-splash">
      <div class="splash-card">
        <div class="splash-logo-wrapper">
          <div class="splash-glow-ring"></div>
          <div class="splash-spin-ring"></div>
          <svg class="splash-svg-logo" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Left Blade forming left arm of U -->
            <path d="M 175,120 L 175,270 C 175,345 240,360 256,290 L 335,120" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
            <!-- Right Blade forming right arm of U -->
            <path d="M 337,120 L 337,270 C 337,345 272,360 256,290 L 177,120" stroke="#F5A623" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
            <!-- Left Base Loop -->
            <circle cx="175" cy="355" r="36" fill="none" stroke="#F5A623" stroke-width="22"/>
            <!-- Right Base Loop -->
            <circle cx="337" cy="355" r="36" fill="none" stroke="#F5A623" stroke-width="22"/>
            <!-- Center Screw Pin -->
            <circle cx="256" cy="275" r="16" fill="#1E1E2A" stroke="#F5A623" stroke-width="6"/>
            <circle cx="256" cy="275" r="6" fill="#FFE082"/>
          </svg>
        </div>

        <div class="splash-brand">
          <h1 class="splash-title">UniHairShop</h1>
          <span class="splash-tagline">Campus Grooming & Beauty</span>
        </div>

        <div class="splash-progress-bar">
          <div class="splash-progress-fill"></div>
        </div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
