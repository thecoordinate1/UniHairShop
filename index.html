<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0C" />
    
    <!-- PWA & Mobile Web App Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="UniHairShop" />
    <meta name="application-name" content="UniHairShop" />
    
    <!-- Manifest & Icons -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    
    <title>UniHairShop — Premium Campus Grooming & Beauty</title>
    <meta name="description" content="On-campus hair grooming, barbing, nails, makeup, and beauty products in Zambia. Fast mobile booking with Airtel, MTN, and Zamtel mobile money." />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Inline Splash Screen Styles -->
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #0A0A0C;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      }
      .splash-logo-container {
        position: relative;
        width: 100px;
        height: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .splash-glow {
        position: absolute;
        inset: -10px;
        background: radial-gradient(circle, rgba(245,166,35,0.3) 0%, rgba(10,10,12,0) 70%);
        border-radius: 50%;
        animation: splashGlow 2s ease-in-out infinite alternate;
      }
      .splash-spinner {
        position: absolute;
        inset: 0;
        border: 3px solid rgba(255, 255, 255, 0.08);
        border-top-color: #F5A623;
        border-radius: 50%;
        animation: splashSpin 1s linear infinite;
      }
      .splash-icon {
        width: 56px;
        height: 56px;
        z-index: 2;
      }
      .splash-title {
        color: #FFFFFF;
        font-size: 1.5rem;
        font-weight: 800;
        letter-spacing: -0.03em;
        margin: 0;
      }
      .splash-subtitle {
        color: #F5A623;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        background: rgba(245, 166, 35, 0.12);
        padding: 4px 12px;
        border-radius: 20px;
        border: 1px solid rgba(245, 166, 35, 0.25);
      }
      @keyframes splashSpin {
        to { transform: rotate(360deg); }
      }
      @keyframes splashGlow {
        from { opacity: 0.4; transform: scale(0.95); }
        to { opacity: 0.9; transform: scale(1.1); }
      }
    </style>
  </head>
  <body class="bg-[#0A0A0C] text-slate-100 font-body antialiased selection:bg-blue-500/30 selection:text-white">
    <div id="root">
      <!-- Opening Splash Loading Screen (Replaced automatically when React mounts) -->
      <div id="app-splash">
        <div class="splash-logo-container">
          <div class="splash-glow"></div>
          <div class="splash-spinner"></div>
          <img src="/icons/icon.svg" alt="UniHairShop" class="splash-icon" />
        </div>
        <h1 class="splash-title">UniHairShop</h1>
        <span class="splash-subtitle">Campus Beauty & Grooming</span>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
