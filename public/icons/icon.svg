<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A24" />
      <stop offset="100%" stop-color="#0A0A0C" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#F5A623" />
      <stop offset="100%" stop-color="#E09418" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4" />

  <!-- Outer Ambient Glow Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.4" />

  <!-- Scissors & Beauty Crown Icon -->
  <g transform="translate(116, 116) scale(11.666)" filter="url(#glow)">
    <!-- Scissors Handle Circles -->
    <circle cx="6" cy="6" r="3" fill="none" stroke="url(#goldGrad)" stroke-width="2" />
    <circle cx="6" cy="18" r="3" fill="none" stroke="url(#goldGrad)" stroke-width="2" />

    <!-- Scissors Blades -->
    <path d="M20 4L8.5 15.5" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round" />
    <path d="M20 20L8.5 8.5" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round" />

    <!-- Center Pivot Dot -->
    <circle cx="12" cy="12" r="1.2" fill="#FFE082" />
  </g>
</svg>
