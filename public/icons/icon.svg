<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark Radial & Linear Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1E1E2A" />
      <stop offset="100%" stop-color="#0A0A0C" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="35%" stop-color="#F5A623" />
      <stop offset="100%" stop-color="#D48806" />
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F5A623" />
      <stop offset="100%" stop-color="#C57E00" />
    </linearGradient>
    <filter id="goldGlowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background App Card -->
  <rect width="512" height="512" rx="115" fill="url(#bgGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="111" fill="none" stroke="rgba(245, 166, 35, 0.25)" stroke-width="3" />

  <!-- Outer Ambient Gold Glow Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.3" />

  <!-- Scissors in the Shape of "U" Logo Group -->
  <g filter="url(#goldGlowFilter)">
    <!-- Base "U" Outer Hairline Curve Accent -->
    <path d="M 160,130 L 160,290 C 160,390 352,390 352,290 L 352,130" 
          fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.25" stroke-linecap="round" />

    <!-- Left Scissors Blade (Forms Left Vertical Arm of "U") -->
    <path d="M 175,120 L 175,270 C 175,345 240,360 256,290 L 335,120" 
          fill="none" stroke="url(#bladeGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Right Scissors Blade (Forms Right Vertical Arm of "U") -->
    <path d="M 337,120 L 337,270 C 337,345 272,360 256,290 L 177,120" 
          fill="none" stroke="url(#goldGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Left Handle Loop (Forms Left Base Curve of "U") -->
    <circle cx="175" cy="355" r="38" fill="none" stroke="url(#goldGrad)" stroke-width="22" />
    <circle cx="175" cy="355" r="38" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.6" />

    <!-- Right Handle Loop (Forms Right Base Curve of "U") -->
    <circle cx="337" cy="355" r="38" fill="none" stroke="url(#goldGrad)" stroke-width="22" />
    <circle cx="337" cy="355" r="38" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.6" />

    <!-- Center Pivot Screw & Jewel -->
    <circle cx="256" cy="275" r="18" fill="#1A1A24" stroke="url(#goldGrad)" stroke-width="7" />
    <circle cx="256" cy="275" r="7" fill="#FFE082" />
  </g>
</svg>
